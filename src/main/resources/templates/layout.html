<!DOCTYPE html>
<html lang="en-AU" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="utf-8" />
    <title th:text="'OAGP - ' + ${pageTitle}">OAGP</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    
    <!-- Prevent white flash by applying theme before page renders -->
    <script>
        (function() {
            const key = 'theme-preference';
            const savedTheme = localStorage.getItem(key);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    
</head>

<body>
<div class="screen">

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>OAGP</h2>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <h3>Actions</h3>

                <a th:href="@{/}" class="nav-item"
                   th:classappend="${activePage == 'scan'} ? ' primary'">
                    New Scan
                </a>

                <a th:href="@{/results/latest}" class="nav-item"
                   th:classappend="${activePage == 'results'} ? ' primary'">
                    View Latest Scan
                </a>
                <a th:href="@{/scans}" class="nav-item"
                   th:classappend="${activePage == 'scans'} ? ' primary'">
                    All Scans
                </a>
            </div>
        </nav>
    </aside>

    <main class="main-content">

        <header class="header-banner">
            <button id="theme-toggle-btn" aria-label="Switch theme" title="Toggle dark mode">🌙</button>
            <h1><strong>OAGP</strong> Open Accessibility Governance Platform</h1>
        </header>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div th:replace="${content}"></div>

    </main>
    
    <button id="scroll-to-top" class="scroll-to-top-btn">Scroll To Top</button>
    
    <div id="page-loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-shell">
            <div class="loader"></div>
            <p>Scanning page, please wait…</p>
        </div>
    </div>
    
</div>

<script th:src="@{/scripts/scroll-to-top.js}"></script>
<script th:src="@{/scripts/loading-overlays.js}"></script>
<script th:src="@{/scripts/dark-mode.js}"></script>
<script th:src="@{/scripts/violation-details-toggle.js}"></script>

</body>
</html>
