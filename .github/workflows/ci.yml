name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: Run Maven verify
        shell: pwsh
        run: mvn -B clean verify

      - name: Install scanner dependencies
        working-directory: scanner
        shell: pwsh
        run: npm ci

      - name: Validate scanner script syntax
        working-directory: scanner
        shell: pwsh
        run: node --check scan-page.js


